<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changxing MotionTech | Precision Electric Linear Actuators</title>
    <style>
        :root {
            --siemens-teal: #00ffcc;       /* 西门子标志性亮青绿 */
            --siemens-dark-teal: #009999;  /* 按钮深青绿 */
            --siemens-bg-dark: #1e262d;    /* 经典深灰蓝底色 */
            --siemens-text-dark: #0f181f;  /* 严谨的深色文字 */
            --siemens-gray-light: #f3f5f7; /* 浅灰背景 */
        }
        body {
            font-family: 'Siemens Sans', 'Segoe UI', Arial, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 0;
            color: var(--siemens-text-dark);
            background-color: #fff;
        }
        /* Top Navigation */
        header {
            background: #fff;
            border-bottom: 2px solid var(--siemens-gray-light);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            max-width: 1280px;
            margin: auto;
            padding: 0 24px;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--siemens-text-dark);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .logo span {
            color: var(--siemens-dark-teal);
        }
        header nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #4a5568;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.2s;
        }
        header nav a:hover {
            color: var(--siemens-dark-teal);
        }
        /* Hero Banner */
        .hero {
            background: var(--siemens-bg-dark);
            color: #fff;
            padding: 100px 0;
            position: relative;
            overflow: hidden;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        @media (max-width: 768px) {
            .hero-grid { grid-template-columns: 1fr; }
        }
        .hero h1 {
            font-size: 48px;
            line-height: 1.1;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .hero h1 span {
            color: var(--siemens-teal);
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 35px;
            color: #cbd5e1;
            max-width: 500px;
        }
        .siemens-btn {
            display: inline-block;
            background: var(--siemens-dark-teal);
            color: #fff;
            padding: 14px 32px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .siemens-btn:hover {
            background: #007777;
        }
        .hero-img {
            width: 100%;
            height: 350px;
            object-fit: contain;
        }
        /* 核心技术优势板块 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-top: 20px;
        }
        .feature-item h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--siemens-text-dark);
        }
        .feature-item p {
            color: #718096;
            font-size: 14px;
        }
        /* Sections */
        section {
            padding: 90px 0;
        }
        .bg-light {
            background-color: var(--siemens-gray-light);
        }
        .section-headline {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 50px;
            position: relative;
        }
        .section-headline::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            width: 40px;
            height: 3px;
            background-color: var(--siemens-teal);
        }
        /* Siemens Style Product Cards */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
        }
        .siemens-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .siemens-card:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-color: var(--siemens-dark-teal);
        }
        .card-img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background-color: #f7fafc;
            padding: 10px;
            box-sizing: border-box;
        }
        .card-content {
            padding: 30px;
        }
        .card-content h3 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 700;
        }
