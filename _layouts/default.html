<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changxing MotionTech | Precision Linear Actuators</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-teal: #00f2fe;
            --accent-blue: #0070f3;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .navbar .logo { font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none; }
        .navbar .logo span { color: var(--accent-teal); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">Changxing<span>MotionTech</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    {{ content }}

    <footer style="padding: 4rem 2rem 2rem 2rem; border-top: 1px solid var(--border-color); background: var(--bg-main); text-align: center; color: var(--text-muted); font-size: 0.85rem;">
        &copy; 2026 Changxing MotionTech. All rights reserved.
    </footer>

</body>
</html>
